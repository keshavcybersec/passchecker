<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --success: #4cc9f0;
            --warning: #f8961e;
            --danger: #f94144;
            --dark: #212529;
            --light: #f8f9fa;
            --gray: #6c757d;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            transition: all 0.3s ease;
        }
        
        .container:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        
        h1 {
            color: var(--dark);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 28px;
        }
        
        .password-container {
            position: relative;
            margin-bottom: 30px;
        }
        
        .password-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
        }
        
        .password-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 18px;
        }
        
        .strength-meter {
            height: 8px;
            margin-top: 15px;
            border-radius: 4px;
            background-color: #e9ecef;
            overflow: hidden;
            position: relative;
        }
        
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease, background-color 0.4s ease;
            border-radius: 4px;
        }
        
        .strength-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 12px;
            color: var(--gray);
        }
        
        .strength-text {
            margin-top: 15px;
            font-weight: 500;
            text-align: center;
            font-size: 16px;
            padding: 8px 0;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .requirements {
            margin-top: 30px;
        }
        
        .requirements h3 {
            color: var(--dark);
            margin-bottom: 15px;
            font-weight: 500;
            font-size: 18px;
        }
        
        .requirement {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            color: var(--gray);
            transition: color 0.3s;
        }
        
        .requirement i {
            margin-right: 10px;
            font-size: 18px;
        }
        
        .requirement.valid {
            color: var(--success);
        }
        
        .requirement.valid i {
            color: var(--success);
        }
        
        .tooltip {
            position: relative;
            display: inline-block;
            margin-left: 5px;
            color: var(--gray);
            cursor: help;
        }
        
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: var(--dark);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
        }
        
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        
        @media (max-width: 576px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Password Strength Analyzer</h1>
        
        <div class="password-container">
            <input type="password" id="password" class="password-input" placeholder="Enter your password" oninput="checkPasswordStrength()">
            <button class="toggle-password" id="togglePassword" onclick="togglePasswordVisibility()">
                <i class="fas fa-eye"></i>
            </button>
            <div class="strength-meter">
                <div class="strength-bar" id="strength-bar"></div>
            </div>
            <div class="strength-labels">
                <span>Weak</span>
                <span>Medium</span>
                <span>Strong</span>
                <span>Very Strong</span>
            </div>
            <div class="strength-text" id="strength-text"></div>
        </div>
        
        <div class="requirements">
            <h3>Password Requirements</h3>
            <div class="requirement" id="length">
                <i class="fas fa-circle"></i>
                At least 12 characters
                <span class="tooltip">
                    <i class="fas fa-info-circle"></i>
                    <span class="tooltiptext">Longer passwords are harder to crack</span>
                </span>
            </div>
            <div class="requirement" id="uppercase">
                <i class="fas fa-circle"></i>
                Contains uppercase letters (A-Z)
            </div>
            <div class="requirement" id="lowercase">
                <i class="fas fa-circle"></i>
                Contains lowercase letters (a-z)
            </div>
            <div class="requirement" id="number">
                <i class="fas fa-circle"></i>
                Contains numbers (0-9)
            </div>
            <div class="requirement" id="special">
                <i class="fas fa-circle"></i>
                Contains special characters (!@#$%^&*)
            </div>
            <div class="requirement" id="common">
                <i class="fas fa-circle"></i>
                Not a common password
            </div>
        </div>
    </div>
    
    <script>
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');
            
            // Reset requirements
            document.querySelectorAll('.requirement').forEach(el => {
                el.classList.remove('valid');
            });
            
            // Check password requirements
            const hasLength = password.length >= 12;
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[!@#$%^&*]/.test(password);
            const isCommon = /password|123456|qwerty|admin|welcome|login|letmein/i.test(password);
            
            // Update requirement indicators
            if (hasLength) document.getElementById('length').classList.add('valid');
            if (hasUppercase) document.getElementById('uppercase').classList.add('valid');
            if (hasLowercase) document.getElementById('lowercase').classList.add('valid');
            if (hasNumber) document.getElementById('number').classList.add('valid');
            if (hasSpecial) document.getElementById('special').classList.add('valid');
            if (!isCommon) document.getElementById('common').classList.add('valid');
            
            // Calculate strength score (0-100)
            let strength = 0;
            
            // Length contributes up to 25 points (12+ chars gets full points)
            strength += hasLength ? 25 : (password.length / 12) * 25;
            
            // Character variety contributes up to 50 points
            let varietyScore = 0;
            if (hasUppercase) varietyScore += 10;
            if (hasLowercase) varietyScore += 10;
            if (hasNumber) varietyScore += 10;
            if (hasSpecial) varietyScore += 20;
            strength += varietyScore;
            
            // Bonus for length beyond 12 (up to 15 additional points)
            if (password.length > 12) {
                strength += Math.min(15, (password.length - 12) * 1.5);
            }
            
            // Deductions for common patterns
            if (isCommon) {
                strength = Math.max(0, strength - 30);
            }
            
            // Ensure strength is between 0 and 100
            strength = Math.min(100, Math.max(0, Math.round(strength)));
            
            // Update strength bar and text
            strengthBar.style.width = strength + '%';
            
            if (strength === 0) {
                strengthBar.style.backgroundColor = 'transparent';
                strengthText.textContent = '';
                strengthText.style.backgroundColor = 'transparent';
            } else if (strength < 40) {
                strengthBar.style.backgroundColor = '#f94144';
                strengthText.textContent = 'Weak Password';
                strengthText.style.color = 'white';
                strengthText.style.backgroundColor = '#f94144';
            } else if (strength < 70) {
                strengthBar.style.backgroundColor = '#f8961e';
                strengthText.textContent = 'Medium Password';
                strengthText.style.color = 'white';
                strengthText.style.backgroundColor = '#f8961e';
            } else if (strength < 90) {
                strengthBar.style.backgroundColor = '#4361ee';
                strengthText.textContent = 'Strong Password';
                strengthText.style.color = 'white';
                strengthText.style.backgroundColor = '#4361ee';
            } else {
                strengthBar.style.backgroundColor = '#4cc9f0';
                strengthText.textContent = 'Very Strong Password';
                strengthText.style.color = 'white';
                strengthText.style.backgroundColor = '#4cc9f0';
            }
            
            console.log('Password:', password, 'Strength:', strength); // Debug line
        }
        
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.getElementById('togglePassword');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.innerHTML = '<i class="fas fa-eye-slash"></i>';
            } else {
                passwordInput.type = 'password';
                toggleButton.innerHTML = '<i class="fas fa-eye"></i>';
            }
        }
    </script>
</body>
</html>
